name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Verify tag matches package versions
        shell: python
        run: |
          import os
          import pathlib
          import sys
          import xml.etree.ElementTree as ET

          tag = os.environ["GITHUB_REF_NAME"]
          mismatched = []
          for manifest in sorted(pathlib.Path(".").glob("*/package.xml")):
              version = ET.parse(manifest).getroot().findtext("version")
              if version != tag:
                  mismatched.append((manifest, version))

          for manifest, version in mismatched:
              print(f"::error file={manifest}::Tag {tag} does not match package version {version}")
          if mismatched:
              sys.exit(1)

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" \
            --generate-notes --verify-tag ${prerelease}
